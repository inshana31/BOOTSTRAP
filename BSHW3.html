<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
   <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
   <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
   <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
   <title>Students dashboard</title>
   <title>course progress dashboard</title>
</head>
<body style="text-align:center;">
      <ul class = "breadcrumb">
      <li class = "breadcrumb-item"><a href = "https://www.mashupstack.com">Home</a></li>
      <li class = "breadcrumb-item"><a href="https://www.mashupstack.com/list-courses">Courses</a></li>
      <li class = "breadcrumb-item active" aria-current = "page"> Web Development</li>
</ul>
<h3>Web Development Course <span class = "badge badge-primary">NEW</span></h3>

<div class="progress" style="height:20px;">
      <div class=" progress-bar progress-bar-striped bg-success" style="width:100%;height:20px">HTML 100%</div>
</div><br>
      <div class="progress" style="height:20px;">
     <div class=" progress-bar progress-bar-striped progress-bar-animated bg-primary" style="width:75%">CSS 75%</div>
</div><br>
<div class="progress" style="height:20px;">
     <div class="progress-bar bg-warning" style="width:50%; height:20px">JAVASCRIPT 50%</div>
</div><br>
<div class="progress"  style="height:20px;">
     <div class="progress-bar bg-danger" style="width:25%; height:20px">BOOTSTRAP 25%</div>
</div><br>

<button type = "button" class = "btn btn-info">Start </button>
<button type = "button" class = "btn btn-dark">Pause </button>
<button type = "button" class = "btn btn-light">Reset</button><br><br>

<ul class="pagination justify-content-center">
  <li class="page-item active"><a class="page-link" href="#">1</a></li>
  <li class="page-item"><a class="page-link" href="#">2</a></li>
  <li class="page-item disabled"><a class="page-link" href="#">3</a></li>
</ul>
</body>
</html>
