<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>travel themed</title>
</head>
<body>
   <!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
   <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
   <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
   <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
   <title>promotional travel banner</title>
</head>
<body>
  <div id="demo" class="carousel slide" data-ride="carousel">
  <ul class="carousel-indicators">
    <li data-target="#demo" data-slide-to="0" class="active"></li>
    <li data-target="#demo" data-slide-to="1"></li>
    <li data-target="#demo" data-slide-to="2"></li>
  </ul>
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="https://static.toiimg.com/thumb/msid-93424991,width-748,height-499,resizemode=4,imgsize-228162/.jpg" alt="Taj Mahal" width="1100" height="500">
      <div class="carousel-caption">
        <h1 class="text-white">South India</h1>
      </div>
    </div>
    <div class="carousel-item">
      <img src="https://www.leisurekart.com/blog/wp-content/uploads/2024/04/Places-to-visit-in-Mumbai.jpg" alt="Mumbai" width="1100" height="500">
      <div class="carousel-caption">
        <h1 class="text-white">Mumbai</h1>
      </div>
    </div>
    <div class="carousel-item">
      <img src="https://www.gokitetours.com/wp-content/uploads/2025/02/Top-8-Bhutan-Tourist-Places-to-Visit-in-2025.webp"  alt="Aluva" width="1100" height="500">
            <div class="carousel-caption">
        <h1 class="text-info">Bhutan</h1>
      </div>
    </div>
  </div>
  <a class="carousel-control-prev" href="#demo" data-slide="prev">
    <span class="carousel-control-prev-icon"></span>
  </a>
  <a class="carousel-control-next" href="#demo" data-slide="next">
    <span class="carousel-control-next-icon"></span>
  </a>
</div><br>

<button type="button" class="btn btn-success" data-toggle="modal" data-target="#myModal"style="display: block; margin: auto;">
   Book Now
  </button>
  <div class="modal " id="myModal">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h4 class="modal-title">More Details</h4>
          <button type="button" class="close" data-dismiss="modal">&times;</button>
        </div>
        <div class="modal-body">
          <p>Experience the breathtaking beauty of the Eiffel Tower, a global cultural icon of France and one of the most recognizable structures in the world.</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
        </div>
        </div>
    </div>
  </div>



<div class="text-center mt-3">
   <i class="fas fa-info-circle" data-toggle="tooltip" data-placement="top" title="Click 'Book Now' to start your journey!"></i>
</div>

<!-- Add Font Awesome for the info icon -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

<!-- Initialize tooltips -->
<script>
$(document).ready(function(){
   $('[data-toggle="tooltip"]').tooltip();
});
</script>

</body>
</html>
