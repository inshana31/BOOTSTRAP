<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
   <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
   <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
   <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
   <title>promotional travel banner</title>
</head>
<body>
  <div id="demo" class="carousel slide" data-ride="carousel">
  <ul class="carousel-indicators">
    <li data-target="#demo" data-slide-to="0" class="active"></li>
    <li data-target="#demo" data-slide-to="1"></li>
    <li data-target="#demo" data-slide-to="2"></li>
  </ul>
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="https://www.trawell.in/images/pics/india_best_main.jpg" alt="Taj Mahal" width="1100" height="500">
      <div class="carousel-caption">
        <h1 class="text-white">Taj Mahal</h1>
      </div>
    </div>
    <div class="carousel-item">
      <img src="https://www.scenic.eu/-/media/project/scenic/scenic-tours/scenic-au/blog/3000-x-1500-header-banner/scl_swiss_alps_switzerland_001_3000x1500.jpg?h=1500&iar=0&w=3000&rev=4940cd78ddff49c88cae0f7c0f67f7c0&hash=641D90635FDD40E85FC1F614C8DA7356" alt="switzerland" width="1100" height="500">
      <div class="carousel-caption">
        <h1 class="text-white">Switzerland</h1>
      </div>
    </div>
    <div class="carousel-item">
      <img src="https://i.natgeofe.com/k/04665f4a-3f8d-4b62-8ca3-09ce7dfc5a20/france-eiffel-tower.jpg?wp=1&w=1084.125&h=609"  alt="Aluva" width="1100" height="500">
            <div class="carousel-caption">
        <h1 class="text-white">Eiffel Tower</h1>
      </div>
    </div>
  </div>
  <a class="carousel-control-prev" href="#demo" data-slide="prev">
    <span class="carousel-control-prev-icon"></span>
  </a>
  <a class="carousel-control-next" href="#demo" data-slide="next">
    <span class="carousel-control-next-icon"></span>
  </a>
</div><br>

<button type="button" class="btn btn-success" data-toggle="modal" data-target="#myModal"style="display: block; margin: auto;">
   Book Now
  </button>
  <div class="modal " id="myModal">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h4 class="modal-title">More Details</h4>
          <button type="button" class="close" data-dismiss="modal">&times;</button>
        </div>
        <div class="modal-body">
          <p>Experience the breathtaking beauty of the Eiffel Tower, a global cultural icon of France and one of the most recognizable structures in the world.</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
        </div>
        </div>
    </div>
  </div>



</body>
</html>
